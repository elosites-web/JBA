<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" width="760" height="220" fill="none">
  <defs>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#77D100" />
      <stop offset="35%" stop-color="#4CAB09" />
      <stop offset="70%" stop-color="#2B921D" />
      <stop offset="100%" stop-color="#0A2F0D" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8FD3FF" />
      <stop offset="45%" stop-color="#4FD0FF" />
      <stop offset="100%" stop-color="#0A84C9" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF6B0" />
      <stop offset="25%" stop-color="#77D100" />
      <stop offset="70%" stop-color="#2B921D" />
      <stop offset="100%" stop-color="#165C2A" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0A2F0D" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Group: Emblem Icon -->
  <g transform="translate(15, 10)" filter="url(#softGlow)">
    <!-- Shield / Organic Emblem Ring -->
    <circle cx="95" cy="95" r="88" fill="#0A2F0D" stroke="#77D100" stroke-width="4" stroke-opacity="0.8"/>
    
    <!-- Water Wave & Pool Element -->
    <path d="M 25 105 C 50 145, 90 165, 165 130 C 145 160, 110 175, 75 168 C 45 162, 30 140, 25 105 Z" fill="url(#blueGrad)" />
    <path d="M 45 125 C 75 160, 115 155, 155 125 C 135 150, 95 165, 60 150 C 50 142, 45 135, 45 125 Z" fill="#8FD3FF" opacity="0.6"/>

    <!-- Lush Garden Leaf Archetype -->
    <path d="M 95 20 C 140 20, 175 60, 170 115 C 130 120, 80 85, 70 55 C 65 40, 75 25, 95 20 Z" fill="url(#leafGrad)" />
    <!-- Leaf Spine & Vein -->
    <path d="M 85 45 Q 115 75 165 110" stroke="#FFF6B0" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.9" />
    <path d="M 105 60 Q 125 50 135 40" stroke="#FFF6B0" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.75" />
    <path d="M 120 75 Q 145 70 155 60" stroke="#FFF6B0" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.75" />

    <!-- Water Droplet Accent -->
    <path d="M 55 75 C 55 55, 75 35, 75 35 C 75 35, 95 55, 95 75 C 95 86, 86 95, 75 95 C 64 95, 55 86, 55 75 Z" fill="url(#blueGrad)"/>
    <ellipse cx="68" cy="65" rx="5" ry="9" transform="rotate(-30 68 65)" fill="#ffffff" opacity="0.7"/>

    <!-- Sun Sparkle / Energy Dot -->
    <circle cx="160" cy="40" r="5" fill="#FFF6B0" />
    <path d="M 160 30 L 160 50 M 150 40 L 170 40" stroke="#FFF6B0" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Typography: JBA -->
  <g transform="translate(225, 10)">
    <!-- JBA Main Wordmark -->
    <text x="0" y="112" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="118" letter-spacing="4" fill="url(#greenGrad)" filter="url(#softGlow)">JBA</text>

    <!-- Subtitle Line 1: SERVIÇO DE JARDINAGEM -->
    <text x="5" y="152" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="22" letter-spacing="3" fill="#2B921D">JARDINAGEM</text>
    
    <!-- Divider / Symbol -->
    <circle cx="188" cy="144" r="3.5" fill="#77D100" />
    <text x="198" y="152" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="22" letter-spacing="3" fill="#0A84C9">LIMPEZA DE PISCINAS</text>

    <!-- Location Accent / Quality Tag -->
    <text x="5" y="184" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="14" letter-spacing="4" fill="#165C2A">SERVIÇOS RESIDENCIAIS • JUNDIAÍ, SP</text>

    <!-- Decorative Underline -->
    <rect x="5" y="196" width="500" height="3" rx="1.5" fill="url(#greenGrad)" />
    <rect x="350" y="196" width="155" height="3" rx="1.5" fill="url(#blueGrad)" />
  </g>
</svg>