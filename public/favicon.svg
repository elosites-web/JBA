<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A2F0D" />
      <stop offset="100%" stop-color="#165C2A" />
    </linearGradient>
    <linearGradient id="leafGradFav" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF6B0" />
      <stop offset="30%" stop-color="#77D100" />
      <stop offset="100%" stop-color="#2B921D" />
    </linearGradient>
    <linearGradient id="waterGradFav" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8FD3FF" />
      <stop offset="50%" stop-color="#4FD0FF" />
      <stop offset="100%" stop-color="#0A84C9" />
    </linearGradient>
  </defs>

  <!-- Background with subtle border -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#77D100" stroke-width="8" stroke-opacity="0.5"/>

  <!-- Botanical Leaf Symbol -->
  <path d="M 256 64 C 360 64 430 140 420 250 C 340 260 230 200 210 130 C 200 100 220 70 256 64 Z" fill="url(#leafGradFav)" />
  <path d="M 230 110 Q 290 170 410 240" stroke="#FFF6B0" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.9" />

  <!-- Water Wave / Pool Symbol -->
  <path d="M 96 240 C 150 320, 240 360, 410 290 C 360 360, 280 400, 200 380 C 130 360, 100 310, 96 240 Z" fill="url(#waterGradFav)" />

  <!-- JBA Letters in Crisp High-Contrast White/Gold -->
  <text x="256" y="380" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="160" letter-spacing="4" fill="#ffffff">JBA</text>
  <text x="256" y="430" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="28" letter-spacing="6" fill="#77D100">JUNDIAÍ</text>
</svg>